# Relative paths are resolved against the repository, not the shell's cwd.
seed: 42
data_version: clean-v4-hardneg
schema_version: data-v2
query_count: 100
document_count: 2000
audit_count: 20
max_answer_words: 16
hard_negative_count: 4
hard_negative_bm25_k: 50
hard_negative_active_top_k: 20
hard_negative_min_active: 2
hard_negative_min_query_cosine: 0.55
hard_negative_min_evidence_cosine: 0.60
hard_negative_e5_model: intfloat/e5-base-v2
hard_negative_e5_model_path: models/intfloat-e5-base-v2
processed_root: data/processed
sources:
  nq:
    version: v1.0-dev
    license: CC-BY-SA-3.0
    files:
      - path: data/raw/nq/nq-dev-00.jsonl.gz
        url: https://storage.googleapis.com/natural_questions/v1.0/dev/nq-dev-00.jsonl.gz
      - path: data/raw/nq/nq-dev-01.jsonl.gz
        url: https://storage.googleapis.com/natural_questions/v1.0/dev/nq-dev-01.jsonl.gz
      - path: data/raw/nq/nq-dev-02.jsonl.gz
        url: https://storage.googleapis.com/natural_questions/v1.0/dev/nq-dev-02.jsonl.gz
      - path: data/raw/nq/nq-dev-03.jsonl.gz
        url: https://storage.googleapis.com/natural_questions/v1.0/dev/nq-dev-03.jsonl.gz
      - path: data/raw/nq/nq-dev-04.jsonl.gz
        url: https://storage.googleapis.com/natural_questions/v1.0/dev/nq-dev-04.jsonl.gz
  hotpotqa:
    version: dev-distractor-v1
    license: CC-BY-SA-4.0
    files:
      - path: data/raw/hotpotqa/hotpot_dev_distractor_v1.json
        url: https://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json
